server {
    listen       80;
    server_name  _;

    # ── 静态资源 ─────────────────────────────────────────────────────────────
    root   /usr/share/nginx/html;
    index  index.html;

    # ── Vue Router History 模式支持 ──────────────────────────────────────────
    # try_files 确保所有前端路由都 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API 反向代理 ──────────────────────────────────────────────────────────
    # 将所有 /api 请求转发到 Java 后端服务
    # 修改 proxy_pass 的地址以对应实际部署的 Java 服务 host/port
    location /api/ {
        proxy_pass         http://knowledge-base-java:8080;    # ← 内部网络：全链路容器部署架构的标准别名
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;               # 文件上传/AI 推理接口耗时较长，需要充裕超时
        proxy_connect_timeout 10s;
        client_max_body_size 200M;             # 与 Spring Boot multipart 配置保持一致
    }

    # ── 静态资源缓存策略 ──────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── 安全 Headers ──────────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection      "1; mode=block";

    # ── Gzip 压缩 ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
