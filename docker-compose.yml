version: '3.8'
services:
  elasticsearch:
    # 启用由本地 Dockerfile 构建的整合了 IK 插件的镜像，不再使用纯净版导致 503 崩溃
    build:
      context: ./elasticsearch
    image: custom-elasticsearch-ik:8.6.2
    container_name: es86
    environment:
      - node.name=es01
      - cluster.name=docker-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false # 本地模拟，禁用安全验证以简化开发
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g" # 限制内存占用，根据本地配置调整
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elastic

