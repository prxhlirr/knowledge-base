  use-v2: true
  total:
    sla-ms: 10000

# XXL-JOB 配置
xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false}
    admin:
      addresses: http://127.0.0.1:8080/xxl-job-admin
    executor:
      appname: kb-handler-dev
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 15

knowledge:
  base:
    storage-type: minio

knowledge-base:
  extract:


    # 智能分流大小界限（默认5MB）
    threshold-bytes: 5242880
    delivery-mode: auto
kb:
  security:
    god-mode: true
