version: '3.8'

# =====================================================================
# Knowledge Base System - 离线环境多容器编排总谱 (All-in-One)
# =====================================================================

services:

  # ────────── 前端交互网关 (Vue + Nginx) ──────────
  knowledge-base-frontend:
    image: knowledge-base-frontend:1.0.0
    container_name: frontend-web
    ports:
      - "80:80"        # 暴露的 Web 访问端口
    restart: always

  # ────────── 核心中枢服务 (Java Spring Boot) ──────────
  knowledge-base-java:
    image: knowledge-base-java:1.0.0
    container_name: kb-java
    ports:
      - "8080:8080"
    volumes:
      # 挂载临时文件和日志
      - ./uploads:/app/uploads
    environment:
      # 【启动最高优先级容器专用 Profile】
      - SPRING_PROFILES_ACTIVE=prod
      
      # 核心中间件连接覆盖（对接下方的基础网络别名）
      - POSTGRES_HOST=database_pg
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=liyz
      - POSTGRES_DB=knowledge_base
      
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
      - REDIS_PASSWORD=liyz12345
      
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USERNAME=
      - ES_PASSWORD=
      
      - MINIO_ENDPOINT=http://minio_storage:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      
      # 跨服务通讯（向 AI 发出信令）
      - AI_SERVICE_HOST=${AI_SERVICE_HOST:-http://ai-service:8001}
      - AI_EMBEDDING_HOST=${AI_EMBEDDING_HOST:-${AI_SERVICE_HOST:-http://ai-service:8001}}
      - AI_COLBERT_HOST=${AI_COLBERT_HOST:-${AI_EMBEDDING_HOST:-${AI_SERVICE_HOST:-http://ai-service:8001}}}
      - AI_RERANK_HOST=${AI_RERANK_HOST:-${AI_SERVICE_HOST:-http://ai-service:8001}}
      - AI_LLM_HOST=${AI_LLM_HOST:-${AI_SERVICE_HOST:-http://ai-service:8001}}
      - KB_INTERNAL_TOKEN=kb-dev-token-change-me-in-prod
      
      # JWT 认证模式（离线部署说明）
      # JWT_DEV_MODE=true：跳过 JWT 验签，从 X-User-Id Header 信任身份。
      #   前端未传 X-User-Id 时系统自动注入 dev-anonymous 身份，具备 _INTERNAL 文档访问权限。
      #   适用于：内网无 SSO 网关的离线部署场景。
      # JWT_DEV_MODE=false（生产）：必须携带合法 JWT，配合 search.trust-gateway-headers=true 使用。
      - JWT_DEV_MODE=true

    depends_on:
      - database_pg
      - redis_cache
      - elasticsearch
    restart: always

